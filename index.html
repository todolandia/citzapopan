<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CITZapopan - Centro de Innovación Tecnológica</title>

  <!-- Favicon actualizado -->
  <link rel="icon" href="C:/Users/02/Documents/citz/corporativo/icono.ico" type="image/x-icon">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ...Todo tu CSS anterior se mantiene igual... */

    /* Slider */
    .slider {
      width: 100%;
      max-width: 1200px;
      height: 400px;
      margin: -50px auto 30px;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      background-color: #000;
    }

    .slides {
      display: flex;
      width: 400%;
      height: 100%;
      transition: transform 0.5s ease-in-out;
    }

    .slide {
      width: 100%;
      flex: 0 0 100%;
      height: 100%;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nav-buttons {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
      padding: 0 20px;
    }

    .nav-buttons button {
      background: rgba(0,0,0,0.5);
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      padding: 10px 15px;
      border-radius: 50%;
      transition: background 0.3s;
    }

    .nav-buttons button:hover {
      background: rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

<header>
  <h1>CITZapopan</h1>
  <p>Centro de Innovación Tecnológica de Zapopan</p>
</header>

<!-- SLIDER -->
<div class="slider">
  <div class="slides" id="slide-track">
    <a class="slide" href="https://ejemplo1.com"><img src="https://via.placeholder.com/1200x400/6a1b9a/ffffff?text=Imagen+1" alt="Imagen 1"></a>
    <a class="slide" href="https://ejemplo2.com"><img src="https://via.placeholder.com/1200x400/8e24aa/ffffff?text=Imagen+2" alt="Imagen 2"></a>
    <a class="slide" href="https://ejemplo3.com"><img src="https://via.placeholder.com/1200x400/ffab00/ffffff?text=Imagen+3" alt="Imagen 3"></a>
    <a class="slide" href="https://ejemplo4.com"><img src="https://via.placeholder.com/1200x400/333333/ffffff?text=Imagen+4" alt="Imagen 4"></a>
  </div>
  <div class="nav-buttons">
    <button onclick="prevSlide()">&#10094;</button>
    <button onclick="nextSlide()">&#10095;</button>
  </div>
</div>

<nav>
  <a href="#inicio" class="active"><i class="fas fa-home"></i> Inicio</a>
  <a href="#cursos"><i class="fas fa-graduation-cap"></i> Cursos</a>
  <a href="#escuelas"><i class="fas fa-school"></i> Escuelas</a>
  <a href="#catalogo"><i class="fas fa-robot"></i> Catálogo</a>
</nav>

<!-- Resto del contenido... -->

<script>
  let currentIndex = 0;
  const slides = document.getElementById('slide-track');
  const totalSlides = slides.children.length;

  function showSlide(index) {
    if (index >= totalSlides) index = 0;
    if (index < 0) index = totalSlides - 1;
    slides.style.transform = `translateX(-${index * 100}%)`;
    currentIndex = index;
  }

  function nextSlide() {
    showSlide(currentIndex + 1);
  }

  function prevSlide() {
    showSlide(currentIndex - 1);
  }

  setInterval(() => {
    nextSlide();
  }, 3000);
</script>
</body>
</html>
