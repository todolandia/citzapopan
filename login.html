<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citzapopan - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .login-box {
            margin-top: 50px;
            width: 300px;
            padding: 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #800080;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #620062;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login Citzapopan</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Usuario" required><br>
            <input type="password" id="password" placeholder="Contraseña" required><br>
            <button type="submit">Ingresar</button>
        </form>
        <div id="error-message" style="color: red; display: none;">Usuario o contraseña incorrectos.</div>
    </div>

    <script>
        const users = {
            "alumno001": "clave001",
            "alumno002": "clave002",
            "alumno003": "clave003",
            "alumno004": "clave004",
            "alumno005": "clave005",
            // Continúa hasta alumno250
            "alumno250": "clave250"
        };

        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (users[username] && users[username] === password) {
                window.location.href = 'panel.html';
            } else {
                document.getElementById('error-message').style.display = 'block';
            }
        });
    </script>
</body>
</html>
