<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citzapopan - Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .panel-container {
            margin-top: 50px;
        }
        button {
            padding: 10px 20px;
            background-color: #800080;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 20px;
        }
        button:hover {
            background-color: #620062;
        }
    </style>
</head>
<body>
    <div class="panel-container">
        <h1>Bienvenido a Citzapopan</h1>
        <button onclick="window.location.href='https://docs.google.com/forms/d/e/1FAIpQLSfttImcG_LbYExnMwsHkdvTAXGHjpfa6wKGgWnm3RA0Syb22w/viewform?usp=sharing'">Subir Actividad</button>
        <button onclick="window.location.href='/actividades/actividad1.pdf'">Descargar Actividad 1</button>
        <button onclick="window.location.href='/actividades/actividad2.docx'">Descargar Actividad 2</button>
        <button onclick="window.location.href='/actividades/actividad3.xlsx'">Descargar Actividad 3</button>
    </div>
</body>
</html>
